id = "cirdes.reviewq"
name = "reviewq"
version = "0.1.4"
min_herdr_version = "0.9.3"
platforms = ["macos"]
description = "Ready-to-use worktrees for the PRs awaiting your review, with a herdr panel and per-PR actions."

# `plugin install` baixa da release o binário deste Mac para ~/.local/bin; `plugin link` pula.
[[build]]
platforms = ["macos"]
command = ["bash", "herdr/install.sh"]

[[panes]]
id = "tui"
title = "reviewq"
placement = "zoomed"
command = ["bin/herdr-reviewq", "tui"]

[[actions]]
id = "open"
title = "reviewq: open panel"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewq", "ui", "open"]

[[actions]]
id = "sync-now"
title = "reviewq: sync now"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewq", "request", "sync"]

[[actions]]
id = "release-all"
title = "reviewq: release all adopted"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewq", "request", "release-all"]

[[actions]]
id = "first-ready"
title = "reviewq: first ready PR"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewq", "focus", "first-ready"]
